name: Ingest

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      top:
        description: Number of top Pokemon to ingest
        default: '100'

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable && pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: pnpm ingest --top ${{ inputs.top || '100' }}

      - run: pnpm typecheck && pnpm build

      - run: pnpm validate

      - name: Commit data
        run: |
          git add data/meta.json data/presets.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ingest $(date -u +%Y-%m-%d)"
          git push
